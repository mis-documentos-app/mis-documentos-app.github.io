<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Documentos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Mis Documentos</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#F2F2F7; --bg2:#FFFFFF; --bg3:#F2F2F7;
  --text:#000; --text2:rgba(60,60,67,.6); --text3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --tint:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(250,250,252,.86); --glass-brd:rgba(255,255,255,.8);
  --glass-shadow:0 10px 34px rgba(0,0,0,.13), 0 1px 3px rgba(0,0,0,.06);
  --hl:rgba(255,255,255,.9);
  --dim:rgba(0,0,0,.25);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --w:min(calc(100vw - 32px), 520px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#000; --bg2:#1C1C1E; --bg3:#2C2C2E;
    --text:#fff; --text2:rgba(235,235,245,.6); --text3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --tint:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158;
    --glass:rgba(44,44,48,.55); --glass-strong:rgba(36,36,40,.88); --glass-brd:rgba(255,255,255,.13);
    --glass-shadow:0 10px 34px rgba(0,0,0,.5);
    --hl:rgba(255,255,255,.16); --dim:rgba(0,0,0,.5);
  }
}
:root[data-theme=dark]{
  --bg:#000; --bg2:#1C1C1E; --bg3:#2C2C2E;
  --text:#fff; --text2:rgba(235,235,245,.6); --text3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --tint:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158;
  --glass:rgba(44,44,48,.55); --glass-strong:rgba(36,36,40,.88); --glass-brd:rgba(255,255,255,.13);
  --glass-shadow:0 10px 34px rgba(0,0,0,.5);
  --hl:rgba(255,255,255,.16); --dim:rgba(0,0,0,.5);
}
:root[data-theme=light]{ color-scheme: light; }
:root[data-theme=dark]{ color-scheme: dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;letter-spacing:-.41px;min-height:100vh}
body.noscroll{overflow:hidden}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.muted{color:var(--text2)} .center{text-align:center}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:.5px solid var(--glass-brd);box-shadow:var(--glass-shadow), inset 0 1px 0 var(--hl)}

/* ---------- Page ---------- */
.page{max-width:552px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 120px)}
.lt{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 4px 12px}
.lt h1{font-size:34px;font-weight:700;letter-spacing:.37px;margin:0;line-height:1.15}
.lt .cbtn{margin-bottom:2px}
.sub-intro{margin:-6px 4px 16px;font-size:15px}
.search{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:12px;background:var(--fill);color:var(--text2);margin-bottom:12px}
.search input{flex:1;border:0;outline:0;background:none;height:100%;font-size:17px;color:var(--text);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--text2)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:17px;background:var(--fill);font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:var(--text);color:var(--bg)}
.sec{font-size:22px;font-weight:700;margin:22px 4px 10px;letter-spacing:.35px;display:flex;align-items:center;gap:10px}
.sec .avatar{width:28px;height:28px;font-size:12px}

/* ---------- Grouped lists ---------- */
.gh{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--text2);margin:24px 20px 7px;letter-spacing:-.08px}
.gf{font-size:13px;color:var(--text2);margin:7px 20px 0;line-height:1.38;letter-spacing:-.08px}
.group{background:var(--bg2);border-radius:26px;overflow:hidden;margin-top:12px}
.gh + .group{margin-top:0}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 20px;width:100%;text-align:left;font-size:17px}
.row + .row::before{content:"";position:absolute;top:0;left:20px;right:0;border-top:.5px solid var(--sep)}
.row.has-ic + .row.has-ic::before{left:62px}
.row .lab{flex:none;white-space:nowrap;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.row .val{flex:1;text-align:right;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .val.wrap{white-space:normal}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.row .grow small{color:var(--text2);font-size:13px;margin-top:1px}
.row.link:active,.row.tap:active{background:var(--fill)}
.row .chev{color:var(--text3)}
.row.red{color:var(--red)} .row.blue{color:var(--tint)}
.row .rowic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.row input:not([type=checkbox]),.row select{flex:1;min-width:0;text-align:right;border:0;outline:0;background:none;color:var(--text2);font-size:17px;-webkit-appearance:none;appearance:none;padding:0}
.row input:focus{color:var(--text)}
.row input[type=date]{min-height:34px;min-width:0;width:100%;max-width:62%;margin-left:auto;display:block;text-align:right}
.row input[type=date]::-webkit-date-and-time-value{text-align:right}
.row select{direction:rtl;text-align-last:right}
.row select option{direction:ltr}
.row textarea{width:100%;border:0;outline:0;background:none;resize:none;font-size:17px;min-height:84px;padding:4px 0}
.mono{font-variant-numeric:tabular-nums}
.val.sens{color:var(--text)}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:1;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .25s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.sw input:checked + span{background:var(--green)}
.sw input:checked + span::after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:6px 0;flex:1}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500}
.seg button.on{background:var(--bg2);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme=dark] .seg button.on{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .seg button.on{background:#636366}}

/* ---------- Document card ---------- */
.dcard{position:relative;width:100%;aspect-ratio:1.586;border-radius:24px;padding:6.2% 6.5%;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 12px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.08);overflow:hidden;display:flex;flex-direction:column;isolation:isolate;container-type:inline-size}
.dcard::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.16),transparent 55%);pointer-events:none;z-index:-1}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-height:9cqw}
.dc-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,4.1cqw,17px);font-weight:700;letter-spacing:.16em;line-height:1.25;text-transform:uppercase;opacity:.95}
.dc-label small{display:block;font-size:.72em;letter-spacing:.06em;font-weight:600;opacity:.7;text-transform:none;margin-top:2px}
.dc-ic{opacity:.92;width:9cqw;height:9cqw;flex:none}
.dc-ic svg{width:100%;height:100%;stroke-width:1.6}
.dc-body{flex:1;display:flex;gap:6%;align-items:center;min-height:0}
.dc-face{width:24%;aspect-ratio:.82;border-radius:14%;background:rgba(255,255,255,.16);display:grid;place-items:end center;overflow:hidden;flex:none}
.dc-face svg{width:78%;height:auto;fill:rgba(255,255,255,.6);stroke:none}
.dc-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.4cqw}
.dc-l{font-size:clamp(8px,2.9cqw,12px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.68}
.dc-v{font-size:clamp(11px,4.3cqw,18px);font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1.2cqw}
.dc-v i.bar{display:block;height:3.6cqw;border-radius:2cqw;background:rgba(255,255,255,.2);width:70%;margin:.6cqw 0}
.dc-num{font-size:clamp(11px,4cqw,16px);letter-spacing:.18em;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.dc-seal{position:absolute;right:-7%;bottom:-14%;width:40%;opacity:.13;z-index:-1}
.dc-seal *{stroke:#fff;fill:none}
.dc-badge{flex:none;align-self:center;white-space:nowrap;font-size:clamp(10px,3.2cqw,13px);font-weight:700;letter-spacing:.02em;padding:.3em .7em;border-radius:99px;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dc-badge.red{background:#FF3B30} .dc-badge.orange{background:#FF9500}

/* wallet stack */
.stack{display:flex;flex-direction:column}
.stack .dcard{cursor:pointer;transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.stack .dcard:not(:last-child){margin-bottom:calc(64px - var(--w) / 1.586)}
.stack .dcard:active{transform:translateY(-6px) scale(.99)}
.stack .dcard + .dcard{box-shadow:0 -8px 22px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.22)}

/* alerts box */
.alertbox{border-radius:26px;padding:6px 0;margin-bottom:6px}
.alertbox .ah{display:flex;align-items:center;gap:8px;padding:10px 18px 4px;font-size:13px;font-weight:600;text-transform:uppercase;color:var(--text2);letter-spacing:-.08px}
.alertbox .row{min-height:50px;padding:8px 18px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.red{background:var(--red)} .dot.orange{background:var(--orange)} .dot.green{background:var(--green)}
.tred{color:var(--red)} .torange{color:var(--orange)} .tgreen{color:var(--green)}

/* empty */
.empty{text-align:center;padding:40px 24px 10px}
.empty .ghost-card{width:68%;margin:0 auto 26px;opacity:.9;transform:rotate(-4deg)}
.empty h2{font-size:22px;margin:0 0 8px}
.empty p{color:var(--text2);margin:0 0 22px;font-size:16px;line-height:1.4}

/* ---------- Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 26px;border-radius:26px;font-size:17px;font-weight:600;width:100%}
.btn.primary{background:var(--tint);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--tint) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:active{filter:brightness(.92)}
.btn.soft{background:var(--fill);color:var(--tint)}
.btn.inline{width:auto;display:inline-flex}
.cbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.cbtn:active{transform:scale(.94)}
.tbtn{height:44px;padding:0 16px;border-radius:22px;font-size:17px;color:var(--text);flex:none}
.tbtn.bold{font-weight:600;background:var(--tint);color:#fff;border-color:transparent}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:max(16px,calc(50% - 260px));bottom:calc(var(--sab) + 12px);height:64px;border-radius:32px;display:flex;padding:4px;gap:2px;z-index:20}
.tab{width:84px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--text);letter-spacing:.1px;transition:background .25s,color .25s}
.tab.on{color:var(--tint);background:var(--fill)}
.fab{position:fixed;right:max(16px,calc(50% - 260px));bottom:calc(var(--sab) + 12px);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--tint);z-index:20;transition:transform .2s}
.fab:active{transform:scale(.92)}

/* ---------- Sheets ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior-x:none;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .42s cubic-bezier(.32,.72,0,1);overscroll-behavior:contain}
.sheet.open{transform:none}
.sh-head{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(var(--sat) + 10px) max(16px, calc(50% - 260px)) 10px;width:100%}
.sh-head::before{content:"";position:absolute;inset:0 0 -14px;background:linear-gradient(var(--bg) 78%,transparent);z-index:-1;pointer-events:none}
.sh-head > :first-child{justify-self:start} .sh-head > :last-child{justify-self:end}
.sh-title{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sh-body{max-width:552px;margin:0 auto;padding:8px 16px calc(var(--sab) + 40px)}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -16px 0;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;padding:6px 16px 14px;scroll-snap-align:center}
.ph{position:relative;width:100%;aspect-ratio:1.586;border-radius:24px;overflow:hidden;background:var(--fill);display:grid;place-items:center;color:var(--text2);box-shadow:0 10px 26px rgba(0,0,0,.14)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.pdf{gap:6px;align-content:center;font-size:15px;font-weight:500}
.ph-tag{position:absolute;left:12px;bottom:12px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pdots{display:flex;justify-content:center;gap:7px;margin:2px 0 12px}
.pdots i{width:8px;height:8px;border-radius:4px;background:var(--fill2);transition:width .3s,background .3s}
.pdots i.on{width:24px;background:var(--text)}
.d-title{font-size:30px;font-weight:700;text-align:center;margin:8px 0 2px;letter-spacing:.3px}
.d-sub{text-align:center;color:var(--text2);margin:0 0 12px;font-size:17px}
.pill{display:flex;width:max-content;margin:0 auto 6px;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;font-size:15px;font-weight:600}
.pill.red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.orange{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.pill.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}

/* edit */
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.type{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:20px;background:var(--bg2);font-size:12px;font-weight:500;text-align:center;line-height:1.15;border:2px solid transparent;transition:border-color .2s}
.type .type-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2))}
.type.on{border-color:var(--tint)}
.achips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.achip{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:15px;font-weight:500}
.achip.on{background:var(--tint);color:#fff}
.photos-edit{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pe{position:relative;aspect-ratio:1.586;border-radius:18px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:var(--text2)}
.pe img{width:100%;height:100%;object-fit:cover}
.pe select{position:absolute;left:8px;bottom:8px;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);border:0;border-radius:99px;padding:5px 10px;-webkit-appearance:none;appearance:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pe-del{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pe.add{border:1.5px dashed var(--text3);background:none;color:var(--tint);gap:4px;align-content:center;font-size:15px;font-weight:500;cursor:pointer}
.pe.busy{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.colors{display:flex;gap:12px;padding:14px 20px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;background:var(--a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.0)}
.colors button.on{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--a)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--a) 85%,#fff),var(--a));flex:none}
.big-avatar{width:84px;height:84px;font-size:32px;margin:6px auto 0}

/* ---------- Lock / PIN ---------- */
.pinlayer{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;animation:fadein .25s}
.pinlayer.out{opacity:0;transition:opacity .25s}
@keyframes fadein{from{opacity:0}}
.lock{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 8vh) 24px calc(var(--sab) + 4vh);max-width:420px;margin:0 auto;width:100%}
.lock-top{text-align:center}
.lock-icon{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#8a2444,#5A142B);box-shadow:0 10px 24px rgba(131,33,63,.35)}
.lock h1{font-size:22px;font-weight:600;margin:0 0 6px}
.lock-sub{color:var(--text2);margin:0;font-size:15px;min-height:20px}
.lock-sub.err{color:var(--red)}
.dots{display:flex;gap:18px;justify-content:center;margin-top:28px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text);transition:background .12s}
.dots i.on{background:var(--text)}
.dots.busy i{animation:pulse .8s infinite}
.dots.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.keypad{display:grid;grid-template-columns:repeat(3,80px);gap:16px 26px;justify-content:center}
.key{width:80px;height:80px;border-radius:50%;font-size:34px;font-weight:400;background:var(--fill);display:grid;place-items:center;transition:background .15s;letter-spacing:0}
.key:active{background:var(--fill2)}
.key.ghost{background:none}
.key.ghost:active{background:var(--fill)}
.key.txt{font-size:16px;font-weight:500}

/* welcome */
.welcome{max-width:460px;margin:0 auto;padding:calc(var(--sat) + 6vh) 24px calc(var(--sab) + 30px);min-height:100vh;display:flex;flex-direction:column}
.w-hero{position:relative;height:200px;margin:0 auto 26px;width:270px}
.w-hero .dcard{position:absolute;width:250px;left:10px}
.welcome h1{font-size:34px;font-weight:700;text-align:center;margin:0 0 10px;letter-spacing:.3px}
.welcome > p{text-align:center;color:var(--text2);margin:0 0 24px;font-size:17px;line-height:1.4}
.feat{display:flex;gap:14px;align-items:flex-start;margin:0 6px 16px}
.feat .fi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tint);background:var(--fill);flex:none}
.feat b{display:block;font-size:16px} .feat span{color:var(--text2);font-size:15px;line-height:1.35}
.welcome .spacer{flex:1;min-height:20px}

/* alert */
.alert-wrap{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--dim);opacity:0;transition:opacity .2s;padding:24px}
.alert-wrap.show{opacity:1}
.alert{width:min(300px,100%);border-radius:30px;padding:22px 18px 16px;text-align:center;transform:scale(1.08);transition:transform .25s cubic-bezier(.3,.7,.3,1);background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:0 20px 50px rgba(0,0,0,.25);border:.5px solid var(--glass-brd)}
.alert-wrap.show .alert{transform:none}
.alert h3{margin:0 0 6px;font-size:17px;font-weight:600}
.alert p{margin:0 0 16px;font-size:14px;line-height:1.38;color:var(--text);opacity:.85}
.alert input{width:100%;height:42px;border-radius:12px;border:0;background:var(--fill);padding:0 12px;outline:0;margin:0 0 14px;font-size:16px}
.alert-btns{display:flex;gap:10px}
.alert-btns.col{flex-direction:column}
.alert-btns button{flex:1;height:46px;border-radius:23px;background:var(--fill);font-size:17px;font-weight:500}
.alert-btns button.bold{font-weight:600;background:var(--tint);color:#fff}
.alert-btns button.red{background:var(--red);color:#fff;font-weight:600}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);transform:translate(-50%,-140%);z-index:120;padding:12px 20px;border-radius:24px;font-size:15px;font-weight:600;transition:transform .35s cubic-bezier(.3,.7,.3,1);pointer-events:none;white-space:nowrap;background:var(--glass-strong);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);box-shadow:var(--glass-shadow);border:.5px solid var(--glass-brd)}
#toast.show{transform:translate(-50%,0)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:80;background:#000;display:grid;place-items:center;overflow:hidden;touch-action:none;animation:fadein .2s}
.viewer img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform;-webkit-user-drag:none}
.viewer .v-bar{position:absolute;top:calc(var(--sat) + 10px);left:16px;right:16px;display:flex;justify-content:space-between}
.viewer .cbtn{color:#fff;background:rgba(60,60,64,.55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.15)}
.viewer iframe{width:100%;height:100%;border:0;background:#fff}

/* privacy cover when app goes to background */
#cover{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;place-items:center}
body.covered #cover{display:grid}
#cover .lock-icon{margin:0}

/* ---------- Scanner ---------- */
.scanner{position:fixed;inset:0;z-index:85;background:#000;color:#fff;display:flex;flex-direction:column;animation:fadein .2s;touch-action:none}
.sc-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(var(--sat) + 10px) 16px 10px}
.sc-top > :first-child{justify-self:start} .sc-top > :last-child{justify-self:end}
.sc-top .tbtn{color:#fff;background:rgba(60,60,64,.6);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.14)}
.sc-top .tbtn.bold{background:var(--tint);border-color:transparent}
.sc-title{font-size:17px;font-weight:600;text-align:center}
.sc-hint{text-align:center;font-size:13px;color:rgba(255,255,255,.6);margin:-2px 0 6px;min-height:17px}
.sc-stage{flex:1;position:relative;margin:6px 22px;min-height:0}
.sc-stage canvas.sc-img{position:absolute;display:block}
.sc-stage svg{position:absolute;overflow:visible}
.sc-stage polygon{fill:rgba(10,132,255,.16);stroke:#0A84FF;stroke-width:2.5;stroke-linejoin:round}
.sc-stage .h-vis{fill:#fff;stroke:#0A84FF;stroke-width:3}
.sc-stage .h-hit{fill:transparent;cursor:grab}
.sc-loupe{position:absolute;width:118px;height:118px;border-radius:50%;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;display:none;overflow:hidden;background:#000}
.sc-loupe::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #0A84FF;border-radius:50%}
.sc-bar{display:flex;justify-content:space-around;margin:10px 16px calc(var(--sab) + 14px);border-radius:30px;padding:6px;background:rgba(44,44,48,.6);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:.5px solid rgba(255,255,255,.14)}
.sc-bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:24px;font-size:11px;font-weight:600;color:#fff}
.sc-bar button.on{color:#0A84FF;background:rgba(255,255,255,.08)}
.sc-busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);font-size:15px;font-weight:600;z-index:3}

.read-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:20px;margin:14px 0 0;font-size:15px;font-weight:500}
.read-banner svg{color:var(--tint)}
.read-banner.busy span{animation:pulse 1.2s infinite}
.row.auto input{color:var(--tint)}
.row.est input{color:var(--orange)}
.row .autotag{font-size:11px;font-weight:600;color:var(--tint);background:color-mix(in srgb,var(--tint) 14%,transparent);padding:2px 7px;border-radius:99px;flex:none}
.row.est .autotag{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
</style>

};
const ico = (n, s = 22) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;
const SILHOUETTE = '<svg viewBox="0 0 60 56"><circle cx="30" cy="18" r="11"/><path d="M4 56c1.5-14 12-22 26-22s24.5 8 26 22z"/></svg>';

/* ================= Catalog ================= */

/* ================= Dates ================= */
function parseD(s){ if(!s) return null; const [y,m,d] = s.split('-').map(Number); return (y && m && d) ? new Date(y, m-1, d) : null; }
function fmtD(s){ const d = parseD(s); return d ? `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}` : ''; }
function daysLeft(s){ const d = parseD(s); if(!d) return null; const t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t) / 86400000); }
function fmtSpan(n){ if(n < 60) return n === 1 ? '1 día' : `${n} días`; const m = Math.round(n / 30.44); if(m < 24) return `${m} meses`; return `${Math.round(n/365)} años`; }
function status(d){

/* ================= Storage (IndexedDB) ================= */
const idb = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('mis-documentos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('kv', mode); const req = fn(t.objectStore('kv'));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); };
  return {
    get: k => run('readonly', s => s.get(k)),
    set: (k, v) => run('readwrite', s => s.put(v, k)),
    del: k => run('readwrite', s => s.delete(k)),
    keys: () => run('readonly', s => s.getAllKeys()),
    clear: () => run('readwrite', s => s.clear()),
    putMany: async entries => { const db = await open(); return new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite'); const s = t.objectStore('kv'); s.clear();
      for(const [k, v] of entries) s.put(v, k);
      t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }); }
  };
})();

/* ================= Crypto =================

   - The DEK is stored wrapped with a key derived from the 6-digit code (PBKDF2-SHA256)

const C = {
  async kek(pin, salt, iter){
    const base = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  },
  aes: raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']),
  async seal(key, bytes){ const iv = rand(12); const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes)); return {iv, ct}; },
  async open(key, box){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:box.iv}, key, box.ct)); }
};
const PBKDF2_ITER = 400000;

/* ================= State ================= */

async function saveVault(){

}
async function loadVault(){
  const box = await idb.get('vault');
  S.v = box ? JSON.parse(td.decode(await C.open(S.key, box))) : {persons:[], docs:[], settings:{}};
  S.v.settings ||= {}; S.v.persons ||= []; S.v.docs ||= [];
  if(S.v.settings.lockAfter === undefined) S.v.settings.lockAfter = 60;

async function putFile(blob){
  const id = uid();
  const box = await C.seal(S.key, new Uint8Array(await blob.arrayBuffer()));
  await idb.set('f:' + id, {...box, type: blob.type || 'application/octet-stream'});
  return id;
}
async function getBlob(id){
  if(S.blobs.has(id)) return S.blobs.get(id);
  const r = await idb.get('f:' + id); if(!r) return null;
  const b = new Blob([await C.open(S.key, r)], {type: r.type});
  S.blobs.set(id, b); return b;
}
async function fileURL(id){
  if(S.urls.has(id)) return S.urls.get(id);
  const b = await getBlob(id); if(!b) return '';
  const u = URL.createObjectURL(b); S.urls.set(id, u); return u;
}
function forgetFile(id){ const u = S.urls.get(id); if(u) URL.revokeObjectURL(u); S.urls.delete(id); S.blobs.delete(id); }

/* ================= Image compression ================= */
async function compress(file){
  if(!file.type.startsWith('image/') || file.type === 'image/gif') return file;
  let src;
  try { src = await createImageBitmap(file); }
  catch { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, max = 2200, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const out = await new Promise(r => c.toBlob(r, 'image/jpeg', .86));
  return out && out.size < file.size * 1.1 ? out : file;
}

/* ================= PIN pad ================= */
function pinPad(o){
  return new Promise(resolve => {
    const el = document.createElement('div'); el.className = 'pinlayer';
    let buf = '', busy = false;
    el.innerHTML = `<div class="lock"><div class="lock-top"><div class="lock-icon">${ico(o.icon || 'lock', 30)}</div><h1></h1><p class="lock-sub"></p><div class="dots">${'<i></i>'.repeat(6)}</div></div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join('')}
      ${o.onBio ? `<button class="key ghost" data-k="bio" aria-label="Face ID">${ico('faceid', 34)}</button>` : o.cancel ? `<button class="key ghost txt" data-k="cancel">Cancelar</button>` : '<span></span>'}
      <button class="key" data-k="0">0</button><button class="key ghost" data-k="del" aria-label="Borrar">${ico('del', 30)}</button></div></div>`;
    document.body.append(el);
    const dotsEl = $('.dots', el);
    const dots = () => $$('i', dotsEl).forEach((d, i) => d.classList.toggle('on', i < buf.length));
    const setText = (t, s, err) => { $('h1', el).textContent = t; const p = $('.lock-sub', el); p.textContent = s || ''; p.classList.toggle('err', !!err); };
    const shake = () => { dotsEl.classList.remove('shake'); void dotsEl.offsetWidth; dotsEl.classList.add('shake'); };
    setText(o.title, o.sub);
    const done = v => { document.removeEventListener('keydown', kd); el.classList.add('out'); setTimeout(() => el.remove(), 260); resolve(v); };
    const press = async k => {
      if(busy) return;
      if(k === 'del'){ buf = buf.slice(0, -1); dots(); return; }
      if(k === 'cancel'){ done(null); return; }
      if(k === 'bio'){ busy = true; const ok = await o.onBio(); busy = false; if(ok) done('bio'); return; }
      if(buf.length >= 6) return;
      buf += k; dots();
      if(buf.length === 6){
        busy = true; dotsEl.classList.add('busy'); await sleep(90);
        let r; try { r = await o.check(buf); } catch(e){ r = 'Error: ' + e.message; }
        dotsEl.classList.remove('busy'); busy = false;
        if(r === true){ done(buf); return; }
        buf = '';
        if(r && typeof r === 'object'){ setText(r.title, r.sub, r.err); if(r.err) shake(); }
        else { setText($('h1', el).textContent, r, true); shake(); }
        dots();
      }
    };
    el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if(b) press(b.dataset.k); });
    const kd = e => { if(/^\d$/.test(e.key)) press(e.key); else if(e.key === 'Backspace') press('del'); else if(e.key === 'Escape' && o.cancel) press('cancel'); };
    document.addEventListener('keydown', kd);
    if(o.autoBio && o.onBio) setTimeout(() => press('bio'), 350);
  });
}

/* ================= Face ID (WebAuthn PRF) ================= */
async function bioAvailable(){
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch { return false; }
}
async function bioDerive(credId, prfSalt){
  const a = await navigator.credentials.get({publicKey:{
    challenge: rand(32), rpId: location.hostname, timeout: 60000, userVerification:'required',
    allowCredentials:[{type:'public-key', id: credId}],
    extensions:{prf:{eval:{first: prfSalt}}}
  }});
  const r = a.getClientExtensionResults()?.prf?.results?.first;
  if(!r) throw new Error('noprf');
  return new Uint8Array(r);
}
async function bioEnable(){
  const prfSalt = rand(32);
  const cred = await navigator.credentials.create({publicKey:{
    challenge: rand(32), rp:{name:'Mis Documentos', id: location.hostname},
    user:{id: rand(16), name:'Mis Documentos', displayName:'Mis Documentos'},
    pubKeyCredParams:[{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform', residentKey:'required', userVerification:'required'},
    timeout: 60000, extensions:{prf:{eval:{first: prfSalt}}}
  }});
  const ext = cred.getClientExtensionResults() || {};
  if(!ext.prf || ext.prf.enabled === false) throw new Error('noprf');
  const credId = new Uint8Array(cred.rawId);
  let out = ext.prf.results?.first ? new Uint8Array(ext.prf.results.first) : await bioDerive(credId, prfSalt);
  const k = await C.aes(out);
  S.meta.bio = {credId, prfSalt, box: await C.seal(k, S.raw)};
  await idb.set('meta', S.meta);
}
async function bioUnlock(){
  try {
    const out = await bioDerive(S.meta.bio.credId, S.meta.bio.prfSalt);
    S.raw = await C.open(await C.aes(out), S.meta.bio.box);
    return true;
  } catch(e){ return false; }
}
async function offerBio(){
  if(!(await bioAvailable())) return;
  const ok = await confirmBox('¿Usar Face ID?', 'Vas a poder abrir la app con tu cara. El código de 6 números sigue sirviendo siempre.', 'Activar');
  if(!ok) return;
  try { await bioEnable(); toast('Face ID activado'); }
  catch(e){ if(e.name !== 'NotAllowedError') await alertBox({title:'No se pudo activar', msg:'Este teléfono o navegador no permite usar Face ID para cifrar. Seguí usando tu código; probá de nuevo desde Ajustes.', buttons:[{text:'OK', value:1, style:'bold'}]}); }
}

function applyTheme(t){
  if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  $$('meta[name=theme-color]').forEach(m => m.remove());
  const m = document.createElement('meta'); m.name = 'theme-color'; m.content = dark ? '#000000' : '#F2F2F7'; document.head.append(m);
}
async function boot(){
  applyTheme(localStorage.getItem('theme'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => applyTheme(localStorage.getItem('theme')));
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if(!window.crypto?.subtle || !window.indexedDB){
    $('#app').innerHTML = `<div class="welcome"><h1>Mis Documentos</h1><p>Abrí esta app desde una dirección segura (https) en Safari o Chrome.</p></div>`; return;
  }
  S.meta = await idb.get('meta');
  if(!S.meta) renderWelcome(); else unlockFlow(true);
}
async function unlockFlow(autoBio){
  $('#app').innerHTML = '';
  const fails = () => +(localStorage.getItem('fails') || 0);
  const r = await pinPad({
    title:'Mis Documentos', sub:'Ingresá tu código',
    onBio: S.meta.bio ? bioUnlock : null, autoBio,
    check: async p => {
      const wait = +(localStorage.getItem('waitUntil') || 0) - Date.now();
      if(wait > 0) return `Esperá ${Math.ceil(wait / 1000)} segundos`;
      try {
        S.raw = await C.open(await C.kek(p, S.meta.salt, S.meta.iter), S.meta.pin);
        localStorage.removeItem('fails'); return true;
      } catch {
        const f = fails() + 1; localStorage.setItem('fails', f);
        if(f >= 5) { localStorage.setItem('waitUntil', Date.now() + Math.min(300, 30 * 2 ** (f - 5)) * 1000); return 'Demasiados intentos. Esperá un momento.'; }
        return 'Código incorrecto';
      }
    }
  });
  S.key = await C.aes(S.raw);
  await loadVault();
  renderMain();
  navigator.storage?.persist?.().catch(() => {});
}
function lock(){
  S.key = null; S.raw = null; S.v = null;
  for(const u of S.urls.values()) URL.revokeObjectURL(u);
  S.urls.clear(); S.blobs.clear(); S.reveal.clear();
  $('#sheets').innerHTML = ''; $$('.viewer,.alert-wrap,.pinlayer').forEach(x => x.remove());
  document.body.classList.remove('noscroll');
  unlockFlow(false);
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    hiddenAt = Date.now();
    if(S.key && Date.now() > S.keepAlive) document.body.classList.add('covered');
    if(S.key && S.v.settings.lockAfter === 0 && Date.now() > S.keepAlive) lock();
  } else {
    document.body.classList.remove('covered');
    if(S.key && Date.now() > S.keepAlive && Date.now() - hiddenAt > S.v.settings.lockAfter * 1000) lock();
    S.keepAlive = 0;
  }
});

function filteredDocs(){

const typeOrder = Object.keys(TYPES);
function docList(){
  if(!S.v.docs.length) return `<div class="empty"><div class="ghost-card">${cardHTML({id:'x', type:'pasaporte', f:{}, alerts:[], photos:[]}, {preview:true})}</div><h2>Agregá tu primer documento</h2><p>Sacale foto al DNI, pasaporte, licencia o los papeles del auto. Todo queda cifrado en este teléfono.</p><button class="btn primary inline" data-act="add">${ico('plus', 20)} Agregar documento</button></div>`;

  }

function maskNum(v, show){

function cardHTML(d, o = {}){
  const t = T(d), f = d.f || {};
  const rows = t.card.map(k => {
    const F = FIELDS[k]; let v = f[k] || '';
    if(F.t === 'date') v = fmtD(v);
    if(F.sens && v && !S.reveal.has(d.id)) v = '•••• ' + String(v).slice(-3);
    return [F.card || F.l, v];
  });
  const st = o.preview ? null : status(d);

async function addFiles(sh, files){
  const add = $('.pe.add', sh); add?.classList.add('busy');
  const toRead = [];
  try {
    for(const file of files){
      if(file.size > 25e6){ toast('Archivo demasiado grande (máx. 25 MB)'); continue; }
      let blob;
      if(file.type.startsWith('image/') && file.type !== 'image/gif'){
        add?.classList.remove('busy');
        blob = await Scan.open(file);
        if(!blob) continue;
        add?.classList.add('busy');
        if(blob === file) blob = await compress(file);
      } else blob = file;
      const id = await putFile(blob);
      sh._new.push(id);
      const n = sh._draft.photos.length;
      sh._draft.photos.push({id, type: blob.type || file.type, kind: (blob.type || file.type).startsWith('image/') ? (PHOTO_KINDS[n] || 'Página') : 'Otro'});
      if((blob.type || '').startsWith('image/')) toRead.push(blob);
    }
  } catch(e){ toast('No se pudo cargar el archivo'); }
  renderEdit(sh);
  for(const b of toRead) await autofill(sh, b);
}
async function saveEdit(sh){
  const d = sh._draft;
  if(!d.personId || !person(d.personId)){ toast('Elegí una persona'); return; }

  for(const k in d.f){ if(!allowed.includes(k)) { delete d.f[k]; continue; } if(typeof d.f[k] === 'string') d.f[k] = d.f[k].trim(); if(!d.f[k]) delete d.f[k]; else if(FIELDS[k]?.upper) d.f[k] = d.f[k].toUpperCase(); }

  else { const i = S.v.docs.findIndex(x => x.id === d.id); S.v.docs[i] = d; }

/* ---------- Calendar (.ics) ---------- */
function icsEsc(s){ return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function ics(docs){
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mis Documentos//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  for(const d of docs){
    const dt = parseD(d.f?.caducidad); if(!dt) continue;
    const nx = new Date(dt); nx.setDate(nx.getDate() + 1);
    const ymd = x => `${x.getFullYear()}${String(x.getMonth() + 1).padStart(2, '0')}${String(x.getDate()).padStart(2, '0')}`;
    const who = person(d.personId)?.name || '';
    const title = `Vence ${docTitle(d)}${who ? ' · ' + who : ''}`;
    L.push('BEGIN:VEVENT', `UID:${d.id}@mis-documentos`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd(dt)}`, `DTEND;VALUE=DATE:${ymd(nx)}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc('Recordatorio de Mis Documentos. Renovar ' + docTitle(d) + (who ? ' de ' + who : '') + '.')}`, 'TRANSP:TRANSPARENT');
    for(const n of [...(d.alerts || []), 0]){
      // alarm at 9:00 on the day n days before
      const trig = n === 0 ? '-PT0M' : `-P${n - 1}DT15H`;
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(n ? `${title} en ${n} días` : title + ' hoy')}`, `TRIGGER:${n === 0 ? 'PT9H' : trig}`, 'END:VALARM');
    }
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function openICS(docs, name){
  const file = new File([ics(docs)], name, {type:'text/calendar'});
  S.keepAlive = Date.now() + 5 * 60e3;
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name; a.target = '_blank'; a.rel = 'noopener';
  document.body.append(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60e3);
}

/* ---------- Share / files ---------- */
async function shareFiles(files, title){
  S.keepAlive = Date.now() + 5 * 60e3;
  if(navigator.canShare?.({files})){
    try { await navigator.share({files, title}); return true; }
    catch(e){ if(e.name === 'AbortError') return false; }
  }
  for(const f of files){
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  return true;
}
const safeName = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'documento';

/* ---------- Backup ---------- */
function b64e(u8){ let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s){ const b = atob(s), u = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function ser(x){
  if(x instanceof Uint8Array) return {$b:b64e(x)};
  if(x instanceof ArrayBuffer) return {$b:b64e(new Uint8Array(x))};
  if(Array.isArray(x)) return x.map(ser);
  if(x && typeof x === 'object'){ const o = {}; for(const k in x) o[k] = ser(x[k]); return o; }
  return x;
}
function deser(x){
  if(Array.isArray(x)) return x.map(deser);
  if(x && typeof x === 'object'){ if(typeof x.$b === 'string' && Object.keys(x).length === 1) return b64d(x.$b); const o = {}; for(const k in x) o[k] = deser(x[k]); return o; }
  return x;
}
async function exportBackup(){
  toast('Preparando copia…');
  S.v.settings.lastBackup = Date.now(); await saveVault();
  const keys = await idb.keys(); const items = {};
  for(const k of keys) items[k] = ser(await idb.get(k));
  const date = new Date().toISOString().slice(0, 10);
  const file = new File([JSON.stringify({app:'mis-documentos', format:1, date, items})], `MisDocumentos-copia-${date}.json`, {type:'application/json'});
  const mb = (file.size / 1e6).toFixed(1);
  const go = await alertBox({title:'Copia lista', msg:`Archivo cifrado de ${mb} MB. Guardalo en Archivos o Drive, o mandátelo por mail.`, buttons:[{text:'Cancelar', value:false}, {text:'Guardar', value:true, style:'bold'}]});
  if(go) { await shareFiles([file], 'Copia de Mis Documentos'); }
  refresh();
}
function pickFile(accept){
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.hidden = true;
    S.keepAlive = Date.now() + 5 * 60e3;
    i.onchange = () => { res(i.files[0] || null); i.remove(); };
    document.body.append(i); i.click();
  });
}
async function importBackup(){
  const f = await pickFile('application/json,.json');
  if(!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if(data.app !== 'mis-documentos' || !data.items?.meta) throw 0; }
  catch { await alertBox({title:'Archivo no válido', msg:'Elegí un archivo de copia de Mis Documentos.', buttons:[{text:'OK', value:1, style:'bold'}]}); return; }
  const items = deser(data.items), meta = items.meta;
  const ok = await confirmBox('¿Restaurar esta copia?', `Copia del ${data.date}. Va a reemplazar todo lo que hay ahora en la app.`, 'Restaurar', true);
  if(!ok) return;
  let raw = null;
  const r = await pinPad({title:'Código de la copia', sub:'Ingresá el código que usabas cuando hiciste la copia', cancel:true,
    check: async p => { try { raw = await C.open(await C.kek(p, meta.salt, meta.iter), meta.pin); return true; } catch { return 'Código incorrecto'; } }});
  if(!r) return;
  await idb.putMany(Object.entries(items));
  S.meta = meta; S.raw = raw; S.key = await C.aes(raw);
  for(const u of S.urls.values()) URL.revokeObjectURL(u); S.urls.clear(); S.blobs.clear();
  await loadVault(); S.filter = 'all'; S.tab = 'docs';
  $('#sheets').innerHTML = ''; document.body.classList.remove('noscroll');
  renderMain(); toast('Copia restaurada');
}

/* ---------- Photo / PDF viewer ---------- */
async function viewFile(fid){
  const b = await getBlob(fid); if(!b) return;
  const url = await fileURL(fid);
  const el = document.createElement('div'); el.className = 'viewer';
  const isImg = b.type.startsWith('image/');
  el.innerHTML = `${isImg ? `<img src="${url}" alt="">` : `<iframe src="${url}" title="PDF"></iframe>`}
    <div class="v-bar"><button class="cbtn" data-v="close" aria-label="Cerrar">${ico('x')}</button><button class="cbtn" data-v="share" aria-label="Compartir">${ico('share')}</button></div>`;
  document.body.append(el);
  el.addEventListener('click', async e => {
    const v = e.target.closest('[data-v]')?.dataset.v;
    if(v === 'close') el.remove();
    if(v === 'share') shareFiles([new File([b], `documento.${isImg ? 'jpg' : 'pdf'}`, {type:b.type})], 'Documento');
  });
  if(!isImg) return;
  const img = $('img', el);
  let sc = 1, tx = 0, ty = 0, start = null, lastTap = 0;
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  el.addEventListener('touchstart', e => {
    if(e.target.closest('.cbtn')) return;
    if(e.touches.length === 2) start = {d: dist(e.touches), sc, tx, ty};
    else if(e.touches.length === 1){
      const now = Date.now();
      if(now - lastTap < 280){ sc = sc > 1 ? 1 : 2.5; tx = ty = 0; img.style.transition = 'transform .25s'; apply(); setTimeout(() => img.style.transition = '', 260); }
      lastTap = now;
      start = {x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty, sc};
    }
  }, {passive:true});
  el.addEventListener('touchmove', e => {
    if(!start) return;
    if(e.touches.length === 2 && start.d){ sc = Math.min(6, Math.max(1, start.sc * dist(e.touches) / start.d)); if(sc === 1){ tx = ty = 0; } apply(); }
    else if(e.touches.length === 1 && start.x !== undefined){
      const dx = e.touches[0].clientX - start.x, dy = e.touches[0].clientY - start.y;
      if(sc > 1){ tx = start.tx + dx; ty = start.ty + dy; apply(); }
      else { ty = Math.max(0, dy); img.style.opacity = String(1 - ty / 500); apply(); }
    }
  }, {passive:true});
  el.addEventListener('touchend', e => {
    if(e.touches.length) return;
    if(sc === 1 && ty > 120){ el.remove(); return; }
    if(sc === 1){ tx = ty = 0; img.style.opacity = ''; img.style.transition = 'transform .2s'; apply(); setTimeout(() => img.style.transition = '', 220); }
    start = null;
  });
}

/* ================= Document scanner =================
   Detects the document edges on-device, lets you fine-tune the 4 corners,
   straightens the perspective and boosts contrast. No libraries, nothing leaves the phone. */
const Scan = {
  async load(file){
    let src;
    try { src = await createImageBitmap(file); }
    catch { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
    const max = 2400, k = Math.min(1, max / Math.max(src.width, src.height));
    const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return c;
  },
  otsu(hist, total){
    let sum = 0; for(let i = 0; i < 256; i++) sum += i * hist[i];
    let sB = 0, wB = 0, best = 0, t = 0;
    for(let i = 0; i < 256; i++){
      wB += hist[i]; if(!wB) continue; const wF = total - wB; if(!wF) break;
      sB += i * hist[i]; const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) ** 2;
      if(v > best){ best = v; t = i; }
    }
    return t;
  },
  blur(a, w, h){ // 3x3 box blur, twice
    let s = a, o = new Float32Array(w * h);
    for(let p = 0; p < 2; p++){
      for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
        let acc = 0, n = 0;
        for(let dy = -1; dy <= 1; dy++){ const yy = y + dy; if(yy < 0 || yy >= h) continue; for(let dx = -1; dx <= 1; dx++){ const xx = x + dx; if(xx < 0 || xx >= w) continue; acc += s[yy * w + xx]; n++; } }
        o[y * w + x] = acc / n;
      }
      [s, o] = [o, new Float32Array(w * h)];
    }
    return s;
  },
  morph(m, w, h, grow){ // dilate (grow=true) or erode, 3x3
    const o = new Uint8Array(w * h);
    for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
      let v = grow ? 0 : 1;
      for(let dy = -1; dy <= 1 && (grow ? !v : v); dy++){ const yy = y + dy; for(let dx = -1; dx <= 1; dx++){ const xx = x + dx;
        const q = (yy < 0 || yy >= h || xx < 0 || xx >= w) ? 0 : m[yy * w + xx];
        if(grow && q){ v = 1; break; } if(!grow && !q){ v = 0; break; } } }
      o[y * w + x] = v;
    }
    return o;
  },
  hull(pts){
    pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for(const p of pts){ while(lo.length >= 2 && cr(lo.at(-2), lo.at(-1), p) <= 0) lo.pop(); lo.push(p); }
    for(const p of pts.reverse()){ while(up.length >= 2 && cr(up.at(-2), up.at(-1), p) <= 0) up.pop(); up.push(p); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  },
  area(q){ let a = 0; for(let i = 0; i < q.length; i++){ const p = q[i], n = q[(i + 1) % q.length]; a += p[0] * n[1] - n[0] * p[1]; } return Math.abs(a) / 2; },
  bestQuad(h){
    // reduce hull to <= 28 points by dropping the vertex that removes the least area
    h = h.slice();
    while(h.length > 28){
      let mi = 0, ma = Infinity;
      for(let i = 0; i < h.length; i++){ const a = h[(i - 1 + h.length) % h.length], b = h[i], c = h[(i + 1) % h.length]; const t = Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])); if(t < ma){ ma = t; mi = i; } }
      h.splice(mi, 1);
    }
    const n = h.length; if(n < 4) return null;
    let best = null, ba = 0;
    for(let a = 0; a < n; a++) for(let b = a + 1; b < n; b++) for(let c = b + 1; c < n; c++) for(let d = c + 1; d < n; d++){
      const q = [h[a], h[b], h[c], h[d]], ar = this.area(q); if(ar > ba){ ba = ar; best = q; }
    }
    return best;
  },
  order(q){
    const cx = q.reduce((s, p) => s + p[0], 0) / 4, cy = q.reduce((s, p) => s + p[1], 0) / 4;
    q = q.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
    let s = 0; for(let i = 1; i < 4; i++) if(q[i][0] + q[i][1] < q[s][0] + q[s][1]) s = i;
    return q.slice(s).concat(q.slice(0, s)); // tl, tr, br, bl
  },
  detect(canvas){
    const W0 = canvas.width, H0 = canvas.height, k = Math.min(1, 320 / Math.max(W0, H0));
    const w = Math.max(8, Math.round(W0 * k)), h = Math.max(8, Math.round(H0 * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(canvas, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h).data, N = w * h;
    // background = median colour of a thin border band
    const band = Math.max(2, Math.round(Math.min(w, h) * .03)), rs = [], gs = [], bs = [];
    for(let y = 0; y < h; y++) for(let xx = 0; xx < w; xx++){
      if(y >= band && y < h - band && xx >= band && xx < w - band) continue;
      const i = (y * w + xx) * 4; rs.push(d[i]); gs.push(d[i + 1]); bs.push(d[i + 2]);
    }
    const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
    const br = med(rs), bg = med(gs), bb = med(bs);
    const cands = [];
    // two cues: colour distance from background, and brightness (documents are usually lighter or darker)
    const dist = new Float32Array(N), lum = new Float32Array(N);
    for(let i = 0; i < N; i++){ const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2]; dist[i] = Math.hypot(r - br, g - bg, b - bb); lum[i] = .299 * r + .587 * g + .114 * b; }
    const bgL = .299 * br + .587 * bg + .114 * bb;
    const fromMask = m => {
      m = this.morph(this.morph(m, w, h, false), w, h, true); // open: remove thin noise
      m = this.morph(this.morph(m, w, h, true), w, h, false); // close: fill small gaps
      const lab = new Int32Array(N), stack = new Int32Array(N); let best = 0, bestId = 0, id = 0;
      for(let s0 = 0; s0 < N; s0++){
        if(!m[s0] || lab[s0]) continue; id++; let sp = 0, cnt = 0; stack[sp++] = s0; lab[s0] = id;
        while(sp){ const p = stack[--sp]; cnt++; const px = p % w, py = (p / w) | 0;
          if(px > 0 && m[p - 1] && !lab[p - 1]){ lab[p - 1] = id; stack[sp++] = p - 1; }
          if(px < w - 1 && m[p + 1] && !lab[p + 1]){ lab[p + 1] = id; stack[sp++] = p + 1; }
          if(py > 0 && m[p - w] && !lab[p - w]){ lab[p - w] = id; stack[sp++] = p - w; }
          if(py < h - 1 && m[p + w] && !lab[p + w]){ lab[p + w] = id; stack[sp++] = p + w; } }
        if(cnt > best){ best = cnt; bestId = id; }
      }
      if(best < N * .08) return;
      const pts = [];
      for(let p = 0; p < N; p++){ if(lab[p] !== bestId) continue; const px = p % w, py = (p / w) | 0;
        if(px === 0 || py === 0 || px === w - 1 || py === h - 1 || lab[p - 1] !== bestId || lab[p + 1] !== bestId || lab[p - w] !== bestId || lab[p + w] !== bestId) pts.push([px + .5, py + .5]); }
      const hl = this.hull(pts); const q = this.bestQuad(hl); if(!q) return;
      const qa = this.area(q), ha = this.area(hl);
      if(qa < N * .1 || qa > N * .97) return;
      cands.push({q, score: (qa / ha) * Math.min(1, best / qa), fill: qa / N});
    };
    const D = this.blur(dist, w, h), Lb = this.blur(lum, w, h);
    let mx = 0; for(let i = 0; i < N; i++) if(D[i] > mx) mx = D[i];
    const ths = [];
    if(mx > 12){
      const hist = new Uint32Array(256), sc = 255 / mx;
      for(let i = 0; i < N; i++) hist[Math.min(255, (D[i] * sc) | 0)]++;
      ths.push(this.otsu(hist, N) / sc);
    }
    for(const t of [10, 16, 24, 36, 52]) if(t < mx) ths.push(t);
    for(const t of ths){ const m = new Uint8Array(N); for(let i = 0; i < N; i++) m[i] = D[i] > t ? 1 : 0; fromMask(m); }
    for(const t of [8, 14, 24]){
      const up = new Uint8Array(N), dn = new Uint8Array(N);
      for(let i = 0; i < N; i++){ up[i] = Lb[i] - bgL > t ? 1 : 0; dn[i] = bgL - Lb[i] > t ? 1 : 0; }
      fromMask(up); fromMask(dn);
    }
    // third cue: strong edges (for a light document on a light table)
    if(!cands.some(c => c.score >= .85)){
      const L = this.blur(lum, w, h), g = new Float32Array(N); let mx = 0;
      for(let y = 1; y < h - 1; y++) for(let xx = 1; xx < w - 1; xx++){
        const i = y * w + xx;
        const gx = L[i - w + 1] + 2 * L[i + 1] + L[i + w + 1] - L[i - w - 1] - 2 * L[i - 1] - L[i + w - 1];
        const gy = L[i + w - 1] + 2 * L[i + w] + L[i + w + 1] - L[i - w - 1] - 2 * L[i - w] - L[i - w + 1];
        g[i] = Math.hypot(gx, gy); if(g[i] > mx) mx = g[i];
      }
      if(mx > 10){
        const hist = new Uint32Array(256), sc = 255 / mx;

        let m = new Uint8Array(N); for(let i = 0; i < N; i++) m[i] = (g[i] * sc) > t ? 1 : 0;
        m = this.morph(m, w, h, true);

        const out = new Uint8Array(N), st = new Int32Array(N); let sp = 0;
        for(let xx = 0; xx < w; xx++){ for(const yy of [0, h - 1]){ const i = yy * w + xx; if(!m[i] && !out[i]){ out[i] = 1; st[sp++] = i; } } }
        for(let yy = 0; yy < h; yy++){ for(const xx of [0, w - 1]){ const i = yy * w + xx; if(!m[i] && !out[i]){ out[i] = 1; st[sp++] = i; } } }
        while(sp){ const p = st[--sp], px = p % w, py = (p / w) | 0;
          for(const q2 of [px > 0 ? p - 1 : -1, px < w - 1 ? p + 1 : -1, py > 0 ? p - w : -1, py < h - 1 ? p + w : -1]) if(q2 >= 0 && !m[q2] && !out[q2]){ out[q2] = 1; st[sp++] = q2; } }
        let fm = new Uint8Array(N); for(let i = 0; i < N; i++) fm[i] = out[i] ? 0 : 1;
        fm = this.morph(this.morph(fm, w, h, false), w, h, false);
        const pts = []; let cnt = 0;
        for(let p = 0; p < N; p++){ if(!fm[p]) continue; cnt++; const px = p % w, py = (p / w) | 0; if(!fm[p - 1] || !fm[p + 1] || !fm[p - w] || !fm[p + w]) pts.push([px + .5, py + .5]); }

          const hl = this.hull(pts), q = this.bestQuad(hl);

    }
    if(!cands.length) return null;
    cands.sort((a, b) => b.score - a.score);

    return this.order(cands[0].q.map(([px, py]) => [px / k, py / k]));

  homography(src, dst){ // maps dst -> src
    const A = [], B = [];
    for(let i = 0; i < 4; i++){
      const [x, y] = dst[i], [u, v] = src[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v);
    }
    for(let i = 0; i < 8; i++){
      let p = i; for(let r = i + 1; r < 8; r++) if(Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
      [A[i], A[p]] = [A[p], A[i]]; [B[i], B[p]] = [B[p], B[i]];
      for(let r = 0; r < 8; r++){ if(r === i) continue; const f = A[r][i] / A[i][i]; for(let c = i; c < 8; c++) A[r][c] -= f * A[i][c]; B[r] -= f * B[i]; }

  warp(canvas, q, enhance){
    const L = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    let ow = Math.max(L(q[0], q[1]), L(q[3], q[2])), oh = Math.max(L(q[0], q[3]), L(q[1], q[2]));
    const ID1 = 85.6 / 53.98, r = ow / oh, rr = r >= 1 ? r : 1 / r;
    if(Math.abs(rr - ID1) / ID1 < .1){ if(r >= 1) oh = ow / ID1; else ow = oh / ID1; } // snap to ID-card shape
    const s = Math.min(1, 2000 / Math.max(ow, oh)); ow = Math.round(ow * s); oh = Math.round(oh * s);

    const out = new ImageData(ow, oh), od = out.data;

        const x0 = Math.max(0, Math.min(sw - 2, u | 0)), y0 = Math.max(0, Math.min(sh - 2, v | 0));
        const fx = Math.max(0, Math.min(1, u - x0)), fy = Math.max(0, Math.min(1, v - y0));
        const i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4, o = (y * ow + x) * 4;
        for(let ch = 0; ch < 3; ch++){

        }
        od[o + 3] = 255;
      }
    }
    if(enhance) this.enhance(od);
    const c = document.createElement('canvas'); c.width = ow; c.height = oh; c.getContext('2d').putImageData(out, 0, 0);
    return c;
  },
  enhance(d){
    const hist = new Uint32Array(256), n = d.length / 4;
    for(let i = 0; i < d.length; i += 4) hist[(.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]) | 0]++;
    let lo = 0, hi = 255, acc = 0;
    for(let i = 0; i < 256; i++){ acc += hist[i]; if(acc > n * .01){ lo = i; break; } }
    acc = 0; for(let i = 255; i >= 0; i--){ acc += hist[i]; if(acc > n * .01){ hi = i; break; } }
    if(hi - lo < 30) return;
    const lut = new Uint8ClampedArray(256);
    for(let i = 0; i < 256; i++) lut[i] = Math.round(Math.pow(Math.max(0, Math.min(1, (i - lo) / (hi - lo))), .92) * 255);
    for(let i = 0; i < d.length; i += 4){ d[i] = lut[d[i]]; d[i + 1] = lut[d[i + 1]]; d[i + 2] = lut[d[i + 2]]; }
  },
  rotate(canvas, q){
    const c = document.createElement('canvas'); c.width = canvas.height; c.height = canvas.width;
    const x = c.getContext('2d'); x.translate(c.width, 0); x.rotate(Math.PI / 2); x.drawImage(canvas, 0, 0);
    const H = canvas.height;
    return [c, q ? this.order(q.map(([px, py]) => [H - py, px])) : null];
  },
  defaultQuad(c){ const mx = c.width * .08, my = c.height * .08; return [[mx, my], [c.width - mx, my], [c.width - mx, c.height - my], [mx, c.height - my]]; },

  /* UI: returns a Blob, or null if cancelled */
  open(file){

    sh._est = new Set([...(sh._est || []), ...r.est.filter(k => got.includes(k))]);
    sh._readMsg = got.length ? `Completé ${got.length} dato${got.length === 1 ? '' : 's'}. Revisalos.` : 'No pude leer datos en esta foto. Completalos a mano.';
  } else sh._readMsg = 'No pude leer datos en esta foto.';
  renderEdit(sh);
}
function setReadBanner(sh){ const b = $('.read-banner', sh); if(b) b.outerHTML = readBannerHTML(sh); }
function readBannerHTML(sh){
  if(sh._reading) return `<div class="read-banner glass busy">${ico('search', 18)}<span>Leyendo los datos del documento…</span></div>`;
  if(sh._readMsg) return `<div class="read-banner glass">${ico('check', 18)}<span>${esc(sh._readMsg)}</span></div>`;
  return '<div class="read-banner" hidden></div>';
}

/* ================= Events ================= */
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act, id = a.dataset.id, sh = a.closest('.sheet');
  switch(act){
    case 'start': startSetup(); break;
    case 'tab': if(S.tab !== a.dataset.tab){ S.tab = a.dataset.tab; renderTab(); window.scrollTo(0, 0); } break;
    case 'filter': S.filter = id; refresh(); break;
    case 'add': if(S.tab === 'family') openPerson(null); else openEdit(null); break;
    case 'open': openDetail(id); break;
    case 'close': closeSheet(sh); break;
    case 'edit': openEdit(id); break;
    case 'cancel-edit': cancelEdit(sh); break;
    case 'save-edit': saveEdit(sh); break;
    case 'set-type': sh._draft.type = a.dataset.type; renderEdit(sh); break;
    case 'toggle-alert': { const n = +a.dataset.n, al = sh._draft.alerts; const i = al.indexOf(n); i < 0 ? al.push(n) : al.splice(i, 1); a.classList.toggle('on', i < 0); break; }
    case 'pick': S.keepAlive = Date.now() + 5 * 60e3; break;
    case 'del-photo': { const [ph] = sh._draft.photos.splice(+a.dataset.i, 1); if(ph){ const ni = sh._new.indexOf(ph.id); if(ni >= 0){ sh._new.splice(ni, 1); idb.del('f:' + ph.id); forgetFile(ph.id); } else sh._removed.push(ph.id); } renderEdit(sh); break; }
    case 'viewph': viewFile(a.dataset.fid); break;
    case 'reveal': if(S.reveal.has(id)) S.reveal.delete(id); else S.reveal.add(id); renderDetail(sh); break;
    case 'copy': {
      const d = getDoc(id), k = a.dataset.k, F = FIELDS[k];
      if(F.sens && !S.reveal.has(id)){ S.reveal.add(id); renderDetail(sh); break; }
      const v = F.t === 'date' ? fmtD(d.f[k]) : d.f[k];
      try { await navigator.clipboard.writeText(v); toast('Copiado'); } catch { toast(v); }
      break;
    }
    case 'cal': { const d = getDoc(id); openICS([d], `vence-${safeName(docTitle(d))}.ics`); break; }
    case 'cal-all': { const ds = S.v.docs.filter(d => d.f?.caducidad); if(ds.length) openICS(ds, 'vencimientos-documentos.ics'); break; }
    case 'share-doc': {
      const d = getDoc(id); const files = [];
      for(const [i, ph] of d.photos.entries()){ const b = await getBlob(ph.id); if(b) files.push(new File([b], `${safeName(docTitle(d))}-${safeName(ph.kind)}-${i + 1}.${b.type.includes('pdf') ? 'pdf' : 'jpg'}`, {type:b.type})); }
      shareFiles(files, docTitle(d)); break;
    }
    case 'del-doc': {
      const d = getDoc(id);
      if(!(await confirmBox('¿Eliminar documento?', `Se borra "${docTitle(d)}" y sus fotos de este teléfono.`, 'Eliminar', true))) break;
      S.v.docs = S.v.docs.filter(x => x.id !== id); await saveVault();
      for(const ph of d.photos || []){ await idb.del('f:' + ph.id); forgetFile(ph.id); }
      closeSheet(sh); refresh(); toast('Documento eliminado'); break;
    }
    case 'edit-person': openPerson(id); break;
    case 'save-person': savePerson(sh); break;
    case 'pcolor': sh._p.color = +a.dataset.i; renderPerson(sh); break;
    case 'person-docs': S.filter = id; S.tab = 'docs'; S.q = ''; closeSheet(sh); renderTab(); break;
    case 'person-add': S.filter = id; closeSheet(sh); setTimeout(() => openEdit(null), 200); break;
    case 'del-person': {
      const ds = S.v.docs.filter(d => d.personId === id);
      if(!(await confirmBox('¿Eliminar persona?', ds.length ? `También se borran sus ${ds.length} documento${ds.length === 1 ? '' : 's'}.` : '', 'Eliminar', true))) break;
      for(const d of ds) for(const ph of d.photos || []){ await idb.del('f:' + ph.id); forgetFile(ph.id); }
      S.v.docs = S.v.docs.filter(d => d.personId !== id); S.v.persons = S.v.persons.filter(p => p.id !== id);
      if(S.filter === id) S.filter = 'all';
      await saveVault(); closeSheet(sh); refresh(); break;
    }
    case 'theme': localStorage.setItem('theme', id); applyTheme(id); renderTab(); break;
    case 'lock-now': lock(); break;
    case 'change-pin': {
      let first = null;
      const cur = await pinPad({title:'Código actual', sub:'', cancel:true, check: async p => { try { await C.open(await C.kek(p, S.meta.salt, S.meta.iter), S.meta.pin); return true; } catch { return 'Código incorrecto'; } }});
      if(!cur) break;
      const np = await pinPad({title:'Código nuevo', sub:'6 números', cancel:true, check: async p => {
        if(!first){ first = p; return {title:'Repetí el código nuevo', sub:''}; }
        if(p !== first){ first = null; return {title:'Código nuevo', sub:'No coincidían', err:true}; }
        return true; }});
      if(!np) break;
      const salt = rand(16);
      S.meta.salt = salt; S.meta.iter = PBKDF2_ITER; S.meta.pin = await C.seal(await C.kek(np, salt, PBKDF2_ITER), S.raw);
      await idb.set('meta', S.meta); toast('Código cambiado'); break;
    }
    case 'export': exportBackup(); break;
    case 'import': importBackup(); break;
    case 'wipe': {
      if(!(await confirmBox('¿Borrar todo?', 'Se eliminan todos los documentos, fotos y el código de este teléfono. No se puede deshacer.', 'Borrar todo', true))) break;
      const sure = await promptBox('Confirmá', 'Escribí BORRAR para confirmar.', 'BORRAR');
      if(sure !== 'BORRAR') break;
      await idb.clear(); localStorage.removeItem('fails'); location.reload(); break;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ S.q = t.value; $('#doclist').innerHTML = docList(); hydrate($('#doclist')); return; }
  const sh = t.closest('.sheet'); if(!sh) return;
  if(t.dataset.f && sh._draft){
    const k = t.dataset.f;
    if(k === 'personId') return;
    if(k === 'title' || k === 'notes') sh._draft[k] = t.value; else { sh._draft.f[k] = t.value; sh._auto?.delete(k); sh._est?.delete(k); }
  }
  if(t.dataset.p && sh._p){ sh._p[t.dataset.p] = t.value; if(t.dataset.p === 'name') $('.big-avatar', sh).textContent = initials(t.value || '?'); }
});
document.addEventListener('change', async e => {
  const t = e.target, sh = t.closest('.sheet');
  if(t.matches('[data-file]') && sh){ const files = [...t.files]; t.value = ''; if(files.length) addFiles(sh, files); return; }
  if(t.dataset.ph !== undefined && sh?._draft){ sh._draft.photos[+t.dataset.ph].kind = t.value; return; }
  if(t.dataset.f === 'personId' && sh?._draft){
    if(t.value === '__new'){
      const name = await promptBox('Nueva persona', '¿A quién le pertenece este documento?', 'Nombre');
      if(name){ const p = {id:uid(), name, rel:'', color:S.v.persons.length % PCOL.length}; S.v.persons.push(p); await saveVault(); sh._draft.personId = p.id; refresh(); }
      renderEdit(sh);
    } else sh._draft.personId = t.value;
    return;
  }
  if(t.dataset.set === 'lockAfter'){ S.v.settings.lockAfter = +t.value; await saveVault(); return; }
  if(t.id === 'bioSw'){
    if(t.checked){ t.checked = false; try { await bioEnable(); t.checked = true; toast('Face ID activado'); } catch(err){ if(err.name !== 'NotAllowedError') await alertBox({title:'No disponible', msg:'Este teléfono o navegador no permite usar Face ID para cifrar. Necesitás iOS 18 o más nuevo con la app agregada a la pantalla de inicio.', buttons:[{text:'OK', value:1, style:'bold'}]}); } }
    else { S.meta.bio = null; await idb.set('meta', S.meta); toast('Face ID desactivado'); }
  }
});
// Show Face ID row only where it can work
const _renderTab = renderTab;
renderTab = function(){ _renderTab(); if(S.tab === 'settings') bioAvailable().then(ok => { const r = $('#bioRow'); if(r && ok) r.style.display = ''; }); };

boot();
</script>
